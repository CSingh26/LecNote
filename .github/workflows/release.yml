name: Checks and container release

on:
  push:
    branches: [main, v1.0.1]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: npm --prefix web ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pytest -q
      - run: ruff check lecnote tests
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:browser
      - name: Isolated API and production UI smoke
        env:
          LECNOTE_TEST_DATA: ${{ runner.temp }}/lecnote-browser
          LECNOTE_TEST_PORT: '8871'
          LECNOTE_TEST_URL: http://127.0.0.1:8871
        run: |
          python tests/browser_server.py > "$RUNNER_TEMP/lecnote-browser.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$LECNOTE_TEST_URL/api/health"; then break; fi
            sleep 1
          done
          node tests/browser-smoke.mjs

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/csingh26/lecnote
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
