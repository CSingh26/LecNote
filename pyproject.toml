[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lecnote"
version = "1.0.1"
description = "Local lecture transcription and OpenAI study notes"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20",
  "pydantic>=2.10,<3", "openai>=1.68,<3", "faster-whisper>=1.1,<2",
  "pypdf>=5,<7", "reportlab>=4,<5", "matplotlib>=3.9,<4", "python-dotenv>=1,<2",
  "python-docx>=1.2,<2", "python-pptx>=1.0.2,<2", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]
speakers = ["pyannote.audio>=3.3,<5"]

[project.scripts]
lecnote = "lecnote.cli:main"

[tool.setuptools.packages.find]
include = ["lecnote*"]

[tool.setuptools.package-data]
lecnote = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
